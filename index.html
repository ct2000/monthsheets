<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="theme-color" content="#f4f7fb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<title>Money</title>

<style>
:root{
  color-scheme: light dark;

  --bg:#f4f7fb;
  --panel:rgba(255,255,255,.76);
  --panel-solid:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:rgba(15,23,42,.07);
  --shadow:0 14px 38px rgba(15,23,42,.08);
  --inner:inset 0 1px 0 rgba(255,255,255,.78);

  --green:#34c759;
  --red:#ff453a;
  --amber:#ff9f0a;
  --blue:#0a84ff;

  --radius:26px;
  --radius-sm:18px;
  --safe-bottom:env(safe-area-inset-bottom);
}

[data-theme="dark"]{
  --bg:#0b1017;
  --panel:rgba(22,27,36,.82);
  --panel-solid:#171c26;
  --text:#f8fafc;
  --muted:#a3a9b4;
  --line:rgba(255,255,255,.09);
  --shadow:0 18px 48px rgba(0,0,0,.42);
  --inner:inset 0 1px 0 rgba(255,255,255,.06);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body{
  background:
    radial-gradient(circle at 18% 0%, rgba(10,132,255,.10), transparent 36%),
    linear-gradient(180deg,var(--bg),var(--bg));
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}

.app-shell{
  max-width:460px;
  min-height:100dvh;
  margin:0 auto;
  padding:14px 14px calc(104px + var(--safe-bottom));
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 2px 14px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand-icon{
  width:40px;
  height:40px;
  border-radius:16px;
  display:grid;
  place-items:center;
  color:var(--text);
  font-weight:950;
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:var(--shadow),var(--inner);
  backdrop-filter:blur(24px) saturate(1.2);
  -webkit-backdrop-filter:blur(24px) saturate(1.2);
}
.title-wrap h1{
  margin:0;
  font-size:22px;
  line-height:1;
  letter-spacing:-.05em;
}
.subtitle{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
  font-weight:750;
}
.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.icon-btn{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--panel);
  color:var(--text);
  display:grid;
  place-items:center;
  box-shadow:var(--inner);
  backdrop-filter:blur(24px) saturate(1.2);
}

.month-select{
  min-width:82px;
  height:38px;
  border:1px solid var(--line);
  border-radius:15px;
  background:var(--panel);
  color:var(--text);
  padding:0 10px;
  font-size:13px;
  font-weight:850;
  box-shadow:var(--inner);
}

.card{
  border-radius:var(--radius);
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:var(--shadow),var(--inner);
  backdrop-filter:blur(26px) saturate(1.2);
  -webkit-backdrop-filter:blur(26px) saturate(1.2);
  overflow:hidden;
  margin:12px 0;
}
.card-pad{padding:14px}

.summary-card{padding:0}
.summary-top{
  display:grid;
  grid-template-columns:1fr 1fr;
}
.summary-cell{
  padding:14px 16px;
}
.summary-cell + .summary-cell{border-left:1px solid var(--line)}
.summary-bottom{
  border-top:1px solid var(--line);
  padding:14px 16px;
}
.label{
  font-size:11px;
  color:var(--muted);
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.02em;
  margin-bottom:6px;
}
.value{
  font-size:28px;
  line-height:.95;
  font-weight:950;
  letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;
}
.meta{
  font-size:11px;
  color:var(--muted);
  font-weight:750;
  line-height:1.35;
  margin-top:6px;
}
.money-form{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-top:12px;
}
.money-form input{
  width:100%;
  min-width:0;
  height:38px;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.58);
  color:var(--text);
  padding:0 11px;
  font-weight:850;
  outline:none;
}
[data-theme="dark"] .money-form input{background:rgba(255,255,255,.06)}
.sync-status{
  margin-top:8px;
  font-size:11px;
  color:var(--muted);
  font-weight:750;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:15px;
  font-weight:950;
  letter-spacing:-.025em;
  margin-bottom:10px;
}
.section-note{
  font-size:11px;
  color:var(--muted);
  font-weight:850;
}

.insights{
  display:grid;
  gap:8px;
}
.insight{
  display:flex;
  gap:9px;
  align-items:flex-start;
  padding:10px;
  border-radius:18px;
  background:rgba(255,255,255,.48);
  border:1px solid var(--line);
}
[data-theme="dark"] .insight{background:rgba(255,255,255,.055)}
.insight-icon{
  flex:0 0 24px;
  width:24px;
  height:24px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(10,132,255,.12);
  color:var(--blue);
  font-size:13px;
  font-weight:900;
}
.insight-text{font-size:12px;font-weight:750;line-height:1.35}

.chart{
  height:94px;
  width:100%;
  display:block;
  overflow:visible;
}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .area{fill:rgba(17,24,39,.055)}
[data-theme="dark"] .chart .area{fill:rgba(255,255,255,.06)}
.chart .line{fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{fill:var(--text);stroke:var(--panel-solid);stroke-width:2}

.legend{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}
.legend-item{
  padding:8px;
  border-radius:16px;
  background:rgba(255,255,255,.48);
  border:1px solid var(--line);
}
[data-theme="dark"] .legend-item{background:rgba(255,255,255,.055)}
.legend-item strong{display:block;font-size:13px;font-weight:950;font-variant-numeric:tabular-nums}
.legend-item span{display:block;margin-top:2px;font-size:10px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}

.upcoming-list{display:grid;gap:8px}
.upcoming-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:18px;
  background:rgba(255,255,255,.48);
  border:1px solid var(--line);
}
[data-theme="dark"] .upcoming-item{background:rgba(255,255,255,.055)}
.upcoming-item strong{font-size:13px}
.upcoming-item span{font-size:12px;color:var(--muted);font-weight:850}

.bills-card{padding:0}
.bills-header{
  width:100%;
  padding:14px;
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.bills-title{font-size:15px;font-weight:950;letter-spacing:-.025em}
.bills-sub{font-size:11px;font-weight:800;color:var(--muted);margin-top:2px;text-align:left}
.chevron{
  width:30px;height:30px;border-radius:999px;
  display:grid;place-items:center;
  background:rgba(17,24,39,.06);
  transition:transform .2s ease;
}
[data-theme="dark"] .chevron{background:rgba(255,255,255,.08)}
body.bills-collapsed .chevron{transform:rotate(-90deg)}
.bills-body{
  padding:0 10px 10px;
  transition:max-height .26s cubic-bezier(.2,.85,.2,1),opacity .2s ease,transform .2s ease;
  overflow:hidden;
}
body.bills-collapsed .bills-body{
  max-height:0;
  opacity:0;
  transform:translateY(-6px);
  padding-bottom:0;
  pointer-events:none;
}
.bill-list{display:grid;gap:8px}
.bill-card{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  align-items:center;
  gap:11px;
  min-height:64px;
  padding:10px 12px;
  border-radius:20px;
  background:rgba(255,255,255,.62);
  border:1px solid var(--line);
}
[data-theme="dark"] .bill-card{background:rgba(255,255,255,.055)}
.bill-icon{
  width:34px;height:34px;border-radius:13px;
  display:grid;place-items:center;
  background:rgba(17,24,39,.06);
  color:var(--text);
  font-size:15px;
  font-weight:900;
}
[data-theme="dark"] .bill-icon{background:rgba(255,255,255,.08)}
.bill-name{
  font-size:14px;
  line-height:1.15;
  font-weight:850;
  letter-spacing:-.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.bill-meta{font-size:11px;color:var(--muted);font-weight:750;margin-top:3px}
.bill-right{text-align:right;display:grid;gap:6px;justify-items:end}
.bill-amount{font-size:14px;font-weight:950;font-variant-numeric:tabular-nums}
.status-pill{
  min-height:26px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:0 9px;
  background:rgba(255,255,255,.5);
  color:var(--text);
  font-size:11px;
  font-weight:850;
}
[data-theme="dark"] .status-pill{background:rgba(255,255,255,.06)}
.bill-card.paid{opacity:.72}
.bill-card.paid .bill-name{text-decoration:line-through;text-decoration-thickness:1.4px}

.bottom-dock{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:max(16px,var(--safe-bottom));
  width:calc(100vw - 32px);
  max-width:430px;
  min-height:68px;
  border-radius:26px;
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:var(--shadow),var(--inner);
  backdrop-filter:blur(28px) saturate(1.25);
  -webkit-backdrop-filter:blur(28px) saturate(1.25);
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  padding:8px;
  z-index:50;
}
.dock-btn{
  border:0;
  border-radius:19px;
  background:transparent;
  color:var(--text);
  display:grid;
  place-items:center;
  gap:2px;
  font-size:11px;
  font-weight:850;
}
.dock-btn b{font-size:20px;line-height:1}

.empty,.error,.spinner{
  border-radius:var(--radius);
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:var(--shadow),var(--inner);
  padding:16px;
  font-size:14px;
  color:var(--muted);
  line-height:1.45;
}
.error{color:#b91c1c}
[data-theme="dark"] .error{color:#fca5a5}

.signin{
  display:grid;
  min-height:calc(100dvh - 48px);
  place-items:center;
}
.signin-card{
  width:100%;
  max-width:390px;
  text-align:center;
  padding:22px;
  border-radius:30px;
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:var(--shadow),var(--inner);
}
.signin-card h2{margin:0 0 8px;font-size:24px;letter-spacing:-.05em}
.signin-card p{margin:0 0 16px;color:var(--muted);font-weight:750;line-height:1.4}
.primary-btn{
  width:100%;
  min-height:44px;
  border:0;
  border-radius:16px;
  background:#111827;
  color:#fff;
  font-weight:900;
}
[data-theme="dark"] .primary-btn{background:#f8fafc;color:#111827}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  place-items:end center;
  padding:0;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(18px);
}
.modal.open{display:grid}
.sheet{
  width:min(430px,100vw);
  max-height:82dvh;
  overflow:auto;
  border-radius:30px 30px 0 0;
  background:var(--panel-solid);
  border:1px solid var(--line);
  border-bottom:0;
  padding:28px 18px calc(18px + var(--safe-bottom));
  box-shadow:0 -22px 64px rgba(0,0,0,.25);
}
.sheet h3{margin:0 0 16px;text-align:center;font-size:18px}
.field{display:grid;gap:6px;margin-bottom:12px;text-align:left}
.field label{font-size:12px;color:var(--muted);font-weight:850}
.field input{
  height:44px;
  border-radius:15px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
  padding:0 12px;
  outline:none;
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.secondary-btn{
  min-height:42px;
  border:1px solid var(--line);
  border-radius:16px;
  background:transparent;
  color:var(--text);
  font-weight:850;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(96px + var(--safe-bottom));
  transform:translateX(-50%) translateY(10px);
  opacity:0;
  pointer-events:none;
  z-index:200;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(17,24,39,.88);
  color:#fff;
  font-size:13px;
  font-weight:850;
  transition:opacity .2s ease,transform .2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
[data-theme="dark"] .toast{background:rgba(248,250,252,.9);color:#111827}

.splash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  background:linear-gradient(180deg,#f4f7fb,#eef3f9);
  transition:opacity .4s ease,visibility .4s ease;
}
[data-theme="dark"] .splash{background:linear-gradient(180deg,#0b1017,#111827)}
.splash.hide{opacity:0;visibility:hidden}
.splash-inner{display:grid;gap:12px;place-items:center;text-align:center}
.splash-logo{
  width:68px;height:68px;border-radius:24px;
  display:grid;place-items:center;
  font-size:30px;font-weight:950;
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:var(--shadow),var(--inner);
  animation:float 2.4s ease-in-out infinite;
}
.splash-text{font-size:13px;font-weight:850;color:var(--muted)}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (min-width:700px){
  .modal{place-items:center}
  .sheet{border-radius:30px;border-bottom:1px solid var(--line)}
}
</style>
</head>

<body>
<div id="splash" class="splash">
  <div class="splash-inner">
    <div class="splash-logo">£</div>
    <div class="splash-text">Syncing your month…</div>
  </div>
</div>

<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">£</div>
      <div class="title-wrap">
        <h1>Money</h1>
        <div id="subtitle" class="subtitle">Ready</div>
      </div>
    </div>
    <div class="top-actions">
      <select id="monthPicker" class="month-select" aria-label="Month" style="display:none"></select>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">☾</button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main id="app" style="display:none">
    <div id="content"></div>
  </main>

  <section id="signin" class="signin" style="display:none">
    <div class="signin-card">
      <div class="brand-icon" style="margin:0 auto 14px">£</div>
      <h2>Connect Money</h2>
      <p>Sign in with Google to sync your spreadsheet-backed budget.</p>
      <button id="signinBtn" class="primary-btn" type="button">Sign in with Google</button>
      <button id="settingsBtnSignin" class="secondary-btn" type="button" style="margin-top:10px;width:100%">Settings</button>
    </div>
  </section>
</div>

<nav id="bottomDock" class="bottom-dock" style="display:none">
  <button id="addBtn" class="dock-btn" type="button"><b>＋</b><span>Add</span></button>
  <button id="refreshBtn" class="dock-btn" type="button"><b>↻</b><span>Refresh</span></button>
  <button id="settingsNav" class="dock-btn" type="button"><b>⚙</b><span>Settings</span></button>
</nav>

<div id="configModal" class="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h3>Settings</h3>
    <div class="field">
      <label for="cfgClientId">Google Client ID</label>
      <input id="cfgClientId" autocomplete="off">
    </div>
    <div class="field">
      <label for="cfgFileId">Spreadsheet ID</label>
      <input id="cfgFileId" autocomplete="off">
    </div>
    <div class="actions">
      <button id="cfgCancel" class="secondary-btn" type="button">Cancel</button>
      <button id="cfgSave" class="primary-btn" type="button">Save</button>
    </div>
  </div>
</div>

<div id="addModal" class="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h3>Add bill</h3>
    <div class="field">
      <label for="newName">Item name</label>
      <input id="newName" placeholder="e.g. Car insurance" autocomplete="off">
    </div>
    <div class="field">
      <label for="newDueDate">Date due</label>
      <input id="newDueDate" placeholder="e.g. 14" autocomplete="off">
    </div>
    <div class="field">
      <label for="newAmount">Amount</label>
      <input id="newAmount" placeholder="0.00" inputmode="decimal" autocomplete="off">
    </div>
    <div class="actions">
      <button id="addCancel" class="secondary-btn" type="button">Cancel</button>
      <button id="addSave" class="primary-btn" type="button">Add</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const VERSION = "v3-clean-20260513-134814";
const DEFAULT_CLIENT_ID = "493978666690-351guk042764k40or99hppe1ehcb13aq.apps.googleusercontent.com";
const DEFAULT_FILE_ID = "1kMyQoPLnKHq6nTMpVjpM5RbyHlt495DIWmIk1wpnUXw";
const SCOPE = "https://www.googleapis.com/auth/spreadsheets";
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let CACHED_TABLES = [];
let TOKEN_CLIENT = null;
let CURRENT_TABLE_INDEX = 0;
let leftWriteTimer = null;

const el = id => document.getElementById(id);
const content = el("content");
const subtitle = el("subtitle");
const monthPicker = el("monthPicker");

function parseMoney(value){
  const cleaned = String(value ?? "").replace(/,/g,"").replace(/£/g,"").replace(/[^\d.-]/g,"");
  const n = parseFloat(cleaned);
  return Number.isFinite(n) ? n : 0;
}
function fmtMoney(n){
  const sign = Number(n) < 0 ? "-" : "";
  return sign + "£" + Math.abs(Number(n)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function normalize(s){return String(s ?? "").trim().toLowerCase()}
function colLetter(n){
  let s=""; n++;
  while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-m)/26)}
  return s;
}
function toast(msg){
  const t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(()=>t.classList.remove("show"),1800);
}

function getConfig(){
  return {
    clientId: localStorage.getItem("money.clientId") || DEFAULT_CLIENT_ID,
    fileId: localStorage.getItem("money.fileId") || DEFAULT_FILE_ID
  };
}
function getToken(){
  try{
    const t = JSON.parse(localStorage.getItem("money.token") || "null");
    return t && Date.now() < t.expiry - 60000 ? t.token : null;
  }catch(e){return null}
}
function setToken(token,expiresInSec){
  localStorage.setItem("money.token",JSON.stringify({token,expiry:Date.now()+(expiresInSec||3600)*1000}));
}
function clearToken(){localStorage.removeItem("money.token")}

function initTokenClient(){
  const {clientId} = getConfig();
  if(!clientId || !window.google?.accounts?.oauth2) return null;
  TOKEN_CLIENT = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: SCOPE,
    callback: response => {
      if(response?.access_token){
        setToken(response.access_token,response.expires_in);
        showApp();
        loadSpreadsheet();
      }else{
        showSignIn("Google sign-in failed.");
      }
    }
  });
  return TOKEN_CLIENT;
}
function requestSignIn(silent=false){
  const client = TOKEN_CLIENT || initTokenClient();
  if(!client){showSignIn("Set your Google OAuth Client ID in Settings first.");return}
  client.requestAccessToken(silent ? {prompt:""} : {prompt:"consent"});
}
function waitForGoogle(timeout=10000){
  return new Promise((resolve,reject)=>{
    const started=Date.now();
    (function tick(){
      if(window.google?.accounts?.oauth2) return resolve();
      if(Date.now()-started>timeout) return reject(new Error("Google sign-in script failed to load."));
      setTimeout(tick,100);
    })();
  });
}

async function sheetsRequest(url,opts={}){
  const token = getToken();
  if(!token) throw new Error("Not signed in");
  const res = await fetch(url,{
    cache:"no-store",
    ...opts,
    headers:{
      Authorization:"Bearer "+token,
      "Content-Type":"application/json",
      "Cache-Control":"no-cache",
      ...(opts.headers||{})
    }
  });
  if(res.status===401){clearToken();throw new Error("Session expired — sign in again.")}
  if(!res.ok) throw new Error(`Sheets API ${res.status}: ${(await res.text()).slice(0,220)}`);
  return res.status===204 ? {} : res.json();
}
async function fetchValues(range){
  const {fileId} = getConfig();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${fileId}/values/${encodeURIComponent(range)}?valueRenderOption=FORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`;
  const data = await sheetsRequest(url,{method:"GET"});
  return data.values || [];
}
async function updateValues(range,values){
  const {fileId} = getConfig();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${fileId}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
  return sheetsRequest(url,{method:"PUT",body:JSON.stringify({range,majorDimension:"ROWS",values})});
}

function parseTablesFromGrid(grid){
  const tables=[];
  for(let r=0;r<grid.length;r++){
    const row = grid[r] || [];
    for(let c=0;c<=row.length-3;c++){
      if(normalize(row[c])==="date due" && normalize(row[c+1])==="due" && normalize(row[c+2])==="paid"){
        const labelCol = c-1;
        if(labelCol<0) continue;
        const label = String(row[labelCol] || "").trim();
        if(!label || normalize(label)==="date due") continue;

        const rows=[];
        let blanks=0;
        for(let dr=r+1; dr<grid.length; dr++){
          const drow = grid[dr] || [];
          const name = String(drow[labelCol] || "").trim();
          if(!name){
            blanks++;
            if(blanks>=2) break;
            continue;
          }
          blanks=0;
          rows.push({
            name,
            dueDate:String(drow[c] ?? "").trim(),
            due:parseMoney(drow[c+1]),
            paid:parseMoney(drow[c+2]),
            sheetRow:dr+1,
            labelCol,
            dateCol:c,
            dueCol:c+1,
            paidCol:c+2
          });
        }
        if(rows.length) tables.push({label,headerRow:r+1,labelCol,dateCol:c,dueCol:c+1,paidCol:c+2,rows});
      }
    }
  }
  return tables;
}

function isRowPaid(row){return row.due <= 0 || row.paid === 0}
function outstandingAmount(row){return row.due <= 0 ? 0 : row.paid}
function paidAmount(row){return row.due <= 0 ? 0 : (row.paid === 0 ? row.due : 0)}
function dueDay(row){
  const m = String(row.dueDate||"").match(/(\d{1,2})/);
  return m ? parseInt(m[1],10) : null;
}
function defaultEndDate(){
  const n = new Date();
  const last = new Date(n.getFullYear(),n.getMonth()+1,0);
  return `${last.getFullYear()}-${String(last.getMonth()+1).padStart(2,"0")}-${String(last.getDate()).padStart(2,"0")}`;
}
function todayISO(){
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
}
function optionBDays(endDate){
  const n = new Date();
  const todayUTC = Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
  const parts = String(endDate || defaultEndDate()).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  const endUTC = parts ? Date.UTC(+parts[1],+parts[2]-1,+parts[3]) : Date.UTC(n.getFullYear(),n.getMonth()+1,0);
  return Math.max(1,Math.floor((endUTC - todayUTC)/86400000));
}
function pickBestTable(tables){
  const now = new Date();
  const full = MONTH_NAMES[now.getMonth()].toLowerCase();
  const short = MONTH_SHORT[now.getMonth()].toLowerCase();
  const i = tables.findIndex(t=>normalize(t.label).includes(full)||normalize(t.label).includes(short));
  return i >= 0 ? i : 0;
}

function leftKey(table){return "money.left."+normalize(table?.label||"month").replace(/[^a-z0-9]/g,"")}
function getStoredLeft(table){
  try{return JSON.parse(localStorage.getItem(leftKey(table))||"null") || {amount:0,endDate:defaultEndDate()}}
  catch(e){return {amount:0,endDate:defaultEndDate()}}
}
function setStoredLeft(table,data){localStorage.setItem(leftKey(table),JSON.stringify(data))}

async function fetchLeftC4(){
  try{
    const values = await fetchValues("Left!C4");
    return parseMoney(values?.[0]?.[0] ?? "");
  }catch(e){
    console.warn("Could not fetch Left!C4",e);
    return null;
  }
}
async function writeLeftC4(amount){
  await updateValues("Left!C4",[[Number(amount)||0]]);
}

function showApp(){
  el("signin").style.display="none";
  el("app").style.display="";
  el("bottomDock").style.display="grid";
}
function showSignIn(message){
  el("app").style.display="none";
  el("bottomDock").style.display="none";
  el("signin").style.display="";
  if(message) el("signin").querySelector("p").textContent = message;
  el("signinBtn").disabled = !getConfig().clientId;
}

function render(){
  if(!CACHED_TABLES.length){
    content.innerHTML = `<div class="empty">No month tables found in your spreadsheet.</div>`;
    return;
  }
  monthPicker.innerHTML = "";
  CACHED_TABLES.forEach((t,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=(t.label||"Month").slice(0,3);
    monthPicker.appendChild(o);
  });

  let selected = localStorage.getItem("money.selectedMonth");
  if(selected===null || !CACHED_TABLES[selected]) selected = pickBestTable(CACHED_TABLES);
  CURRENT_TABLE_INDEX = Number(selected)||0;
  monthPicker.value = CURRENT_TABLE_INDEX;
  monthPicker.style.display = "";
  monthPicker.onchange = () => {
    CURRENT_TABLE_INDEX = Number(monthPicker.value)||0;
    localStorage.setItem("money.selectedMonth",String(CURRENT_TABLE_INDEX));
    renderMonth(CACHED_TABLES[CURRENT_TABLE_INDEX]);
  };
  renderMonth(CACHED_TABLES[CURRENT_TABLE_INDEX]);
}

function calculate(table){
  const rows = table.rows || [];
  const outstanding = rows.reduce((s,r)=>s+outstandingAmount(r),0);
  const totalPaid = rows.reduce((s,r)=>s+paidAmount(r),0);
  const paidCount = rows.filter(isRowPaid).length;
  const unpaidCount = rows.length - paidCount;
  const stored = getStoredLeft(table);
  const days = optionBDays(stored.endDate || defaultEndDate());
  const spendable = (Number(stored.amount)||0) - outstanding;
  const perDay = spendable / days;
  const upcoming = rows
    .filter(r=>!isRowPaid(r))
    .map(r=>{
      const day = dueDay(r);
      const now = new Date();
      if(!day) return null;
      const due = new Date(now.getFullYear(),now.getMonth(),day,23,59,59);
      const daysUntil = Math.ceil((due - now)/86400000);
      return {...r,daysUntil};
    })
    .filter(Boolean)
    .filter(r=>r.daysUntil>=0 && r.daysUntil<=7)
    .sort((a,b)=>a.daysUntil-b.daysUntil)
    .slice(0,4);
  const largest = rows.filter(r=>!isRowPaid(r)).sort((a,b)=>outstandingAmount(b)-outstandingAmount(a))[0] || null;
  return {rows,outstanding,totalPaid,paidCount,unpaidCount,stored,days,spendable,perDay,upcoming,largest};
}

function miniChart(values){
  const width=360,height=94,pad=10;
  const max=Math.max(...values,1), min=Math.min(...values,0), range=Math.max(1,max-min);
  const step=(width-pad*2)/Math.max(1,values.length-1);
  const points=values.map((v,i)=>[pad+i*step,height-pad-((v-min)/range)*(height-pad*2)]);
  const d=points.map((p,i)=>`${i?"L":"M"} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const area=`${d} L ${points.at(-1)[0].toFixed(1)} ${height-pad} L ${points[0][0].toFixed(1)} ${height-pad} Z`;
  const last=points.at(-1);
  return `<svg class="chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
    <line class="grid" x1="${pad}" y1="${height-pad}" x2="${width-pad}" y2="${height-pad}"></line>
    <line class="grid" x1="${pad}" y1="${height/2}" x2="${width-pad}" y2="${height/2}"></line>
    <path class="area" d="${area}"></path>
    <path class="line" d="${d}"></path>
    <circle class="dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4"></circle>
  </svg>`;
}

function renderMonth(table){
  const c = calculate(table);
  const billRows = [...table.rows].sort((a,b)=>{
    const ap=isRowPaid(a), bp=isRowPaid(b);
    if(ap!==bp) return ap ? 1 : -1;
    return (dueDay(a)||99)-(dueDay(b)||99);
  });

  subtitle.textContent = `${table.label} · refreshed ${new Date().toLocaleString("en-GB",{hour:"2-digit",minute:"2-digit"})}`;

  const values = [
    Math.max(0,c.stored.amount + c.outstanding*.28),
    Math.max(0,c.stored.amount + c.outstanding*.14),
    Math.max(0,c.stored.amount),
    Math.max(0,c.stored.amount - c.outstanding*.2),
    Math.max(0,c.stored.amount - c.outstanding)
  ];

  const insightLargest = c.largest ? `Largest unpaid bill: ${escapeHtml(c.largest.name)} at ${fmtMoney(outstandingAmount(c.largest))}.` : `No unpaid bills left.`;
  const upcomingText = c.upcoming.length ? `${c.upcoming.length} bill${c.upcoming.length===1?"":"s"} due in the next 7 days.` : `No unpaid bills due in the next 7 days.`;

  content.innerHTML = `
    <section class="card summary-card" id="summaryCard">
      <div class="summary-top">
        <div class="summary-cell">
          <div class="label">Outstanding</div>
          <div class="value">${fmtMoney(c.outstanding)}</div>
        </div>
        <div class="summary-cell">
          <div class="label">Paid so far</div>
          <div class="value">${fmtMoney(c.totalPaid)}</div>
        </div>
      </div>
      <div class="summary-bottom">
        <div class="label">Money left per day</div>
        <div class="value">${fmtMoney(c.perDay)}</div>
        <div class="meta">${c.days} day${c.days===1?"":"s"} left · ${fmtMoney(c.stored.amount)} − ${fmtMoney(c.outstanding)} = ${fmtMoney(c.spendable)}</div>
        <div class="money-form">
          <input id="leftAmount" inputmode="decimal" autocomplete="off" value="${Number(c.stored.amount||0).toFixed(2)}" aria-label="Money left">
          <input id="leftUntil" type="date" value="${c.stored.endDate || defaultEndDate()}" aria-label="End date">
        </div>
        <div id="leftSyncStatus" class="sync-status">Budget synced</div>
      </div>
    </section>

    <section class="card card-pad" id="miniAnalytics">
      <div class="section-title">
        <span>Mini analytics</span>
        <span class="section-note">${fmtMoney(c.perDay)}/day</span>
      </div>
      ${miniChart(values)}
      <div class="legend">
        <div class="legend-item"><strong>${fmtMoney(c.stored.amount)}</strong><span>Money left</span></div>
        <div class="legend-item"><strong>${fmtMoney(c.outstanding)}</strong><span>Unpaid</span></div>
        <div class="legend-item"><strong>${fmtMoney(c.totalPaid)}</strong><span>Paid</span></div>
      </div>
    </section>

    <section class="card card-pad">
      <div class="section-title"><span>Smart insights</span><span class="section-note">Live</span></div>
      <div class="insights">
        <div class="insight"><span class="insight-icon">⏱</span><span class="insight-text">${upcomingText}</span></div>
        <div class="insight"><span class="insight-icon">£</span><span class="insight-text">${insightLargest}</span></div>
        <div class="insight"><span class="insight-icon">•</span><span class="insight-text">Daily allowance: ${fmtMoney(c.perDay)} after unpaid bills.</span></div>
      </div>
    </section>

    <section class="card card-pad">
      <div class="section-title"><span>Upcoming this week</span><span class="section-note">Next 7 days</span></div>
      <div class="upcoming-list">
        ${c.upcoming.length ? c.upcoming.map(r=>`
          <div class="upcoming-item">
            <strong>${escapeHtml(r.name)}</strong>
            <span>${r.daysUntil===0?"Today":`in ${r.daysUntil} day${r.daysUntil===1?"":"s"}`} · ${fmtMoney(outstandingAmount(r))}</span>
          </div>`).join("") : `<div class="upcoming-item"><strong>Nothing urgent</strong><span>Next 7 days clear</span></div>`}
      </div>
    </section>

    <section class="card bills-card" id="billsCard">
      <button id="billsHeader" class="bills-header" type="button" aria-expanded="${document.body.classList.contains("bills-collapsed")?"false":"true"}">
        <span>
          <div class="bills-title">Bills</div>
          <div class="bills-sub">${c.unpaidCount} unpaid · ${c.paidCount} paid</div>
        </span>
        <span class="chevron">⌄</span>
      </button>
      <div class="bills-body">
        <div class="bill-list">
          ${billRows.map(r=>{
            const paid=isRowPaid(r);
            return `<article class="bill-card ${paid?"paid":"unpaid"}">
              <div class="bill-icon">${billIcon(r.name)}</div>
              <div>
                <div class="bill-name">${escapeHtml(r.name)}</div>
                <div class="bill-meta">Due ${escapeHtml(r.dueDate || "—")}</div>
              </div>
              <div class="bill-right">
                <div class="bill-amount">${fmtMoney(r.due)}</div>
                <button class="status-pill" data-paid-row="${r.sheetRow}" type="button">${paid?"Paid":"Outstanding"}</button>
              </div>
            </article>`;
          }).join("")}
        </div>
      </div>
    </section>
  `;

  wireRendered(table);
}

function billIcon(name){
  const n=normalize(name);
  if(/rent|mortgage|council|home/.test(n)) return "⌂";
  if(/gas|electric|water|energy|octopus|edf|eon|utility/.test(n)) return "⚡";
  if(/phone|mobile|internet|wifi|broadband|bt|virgin|ee|o2|vodafone|three/.test(n)) return "◉";
  if(/car|fuel|petrol|mot|parking|tax/.test(n)) return "◆";
  if(/insurance|cover|policy/.test(n)) return "◇";
  if(/netflix|spotify|prime|amazon|disney|apple|tv|subscription|youtube/.test(n)) return "▶";
  if(/gym|health|dental|medical|therapy/.test(n)) return "+";
  if(/loan|credit|card|bank|klarna|paypal/.test(n)) return "£";
  return String(name||"•").trim().slice(0,1).toUpperCase() || "•";
}

function wireRendered(table){
  const header = el("billsHeader");
  if(header){
    header.onclick = () => {
      const collapsed = document.body.classList.toggle("bills-collapsed");
      localStorage.setItem("money.billsCollapsed", collapsed ? "1" : "0");
      header.setAttribute("aria-expanded", collapsed ? "false" : "true");
    };
  }

  document.querySelectorAll("[data-paid-row]").forEach(btn=>{
    btn.onclick = () => togglePaid(btn.dataset.paidRow);
  });

  const leftAmount = el("leftAmount");
  const leftUntil = el("leftUntil");

  const updateLocal = () => {
    const amount = parseMoney(leftAmount.value);
    const endDate = leftUntil.value || defaultEndDate();
    setStoredLeft(table,{amount,endDate});
    renderMonth(table);
    scheduleLeftWrite(amount);
  };

  if(leftAmount){
    leftAmount.oninput = () => {
      const amount = parseMoney(leftAmount.value);
      setStoredLeft(table,{amount,endDate:leftUntil.value || defaultEndDate()});
      updateSummaryOnly(table);
      scheduleLeftWrite(amount);
    };
    leftAmount.onblur = () => {
      leftAmount.value = Number(parseMoney(leftAmount.value)||0).toFixed(2);
      updateLocal();
    };
  }
  if(leftUntil) leftUntil.onchange = updateLocal;
}

function updateSummaryOnly(table){
  const c = calculate(table);
  const summary = el("summaryCard");
  if(!summary) return;
  const values = summary.querySelectorAll(".value");
  if(values[0]) values[0].textContent = fmtMoney(c.outstanding);
  if(values[1]) values[1].textContent = fmtMoney(c.totalPaid);
  if(values[2]) values[2].textContent = fmtMoney(c.perDay);
  const meta = summary.querySelector(".summary-bottom .meta");
  if(meta) meta.textContent = `${c.days} day${c.days===1?"":"s"} left · ${fmtMoney(c.stored.amount)} − ${fmtMoney(c.outstanding)} = ${fmtMoney(c.spendable)}`;
}

function scheduleLeftWrite(amount){
  const status = el("leftSyncStatus");
  if(status) status.textContent = "Saving changes…";
  clearTimeout(leftWriteTimer);
  leftWriteTimer = setTimeout(async()=>{
    try{
      await writeLeftC4(amount);
      if(status) status.textContent = "Everything up to date";
    }catch(e){
      if(status) status.textContent = "Could not save changes";
      console.warn(e);
    }
  },800);
}

async function togglePaid(sheetRow){
  const table = CACHED_TABLES[CURRENT_TABLE_INDEX] || CACHED_TABLES[0];
  const row = table?.rows.find(r=>String(r.sheetRow)===String(sheetRow));
  if(!row) return;
  try{
    const nextOutstanding = isRowPaid(row) ? row.due : 0;
    await updateValues(`${colLetter(row.paidCol)}${row.sheetRow}`,[[nextOutstanding]]);
    toast("Updated");
    await loadSpreadsheet();
  }catch(e){
    alert("Could not update bill: " + (e.message || e));
  }
}

async function addBill(){
  const table = CACHED_TABLES[CURRENT_TABLE_INDEX] || CACHED_TABLES[0];
  if(!table){alert("No month loaded.");return}

  const name = el("newName").value.trim();
  const dueDate = el("newDueDate").value.trim();
  const amount = parseMoney(el("newAmount").value);

  if(!name){alert("Please enter an item name.");return}
  if(!amount || amount <= 0){alert("Please enter an amount.");return}

  try{
    el("addSave").disabled = true;
    el("addSave").textContent = "Adding…";
    const row = Math.max(...table.rows.map(r=>r.sheetRow||0)) + 1;
    await updateValues(`${colLetter(table.labelCol)}${row}:${colLetter(table.paidCol)}${row}`,[[name,dueDate,amount,amount]]);
    closeModal("addModal");
    toast("Bill added");
    await loadSpreadsheet();
  }catch(e){
    alert("Could not add bill: " + (e.message || e));
  }finally{
    el("addSave").disabled = false;
    el("addSave").textContent = "Add";
  }
}

async function loadSpreadsheet(){
  content.innerHTML = `<div class="spinner">Fetching your spreadsheet…</div>`;
  try{
    const grid = await fetchValues("A1:ZZ2000");
    CACHED_TABLES = parseTablesFromGrid(grid);
    const leftC4 = await fetchLeftC4();

    if(CACHED_TABLES.length){
      const best = localStorage.getItem("money.selectedMonth");
      const index = best !== null && CACHED_TABLES[best] ? Number(best) : pickBestTable(CACHED_TABLES);
      const table = CACHED_TABLES[index];
      const stored = getStoredLeft(table);
      if(leftC4 !== null){
        setStoredLeft(table,{...stored,amount:leftC4});
      }
    }

    render();
    toast("Updated");
  }catch(e){
    if(String(e.message||e).toLowerCase().includes("sign")){
      showSignIn();
      return;
    }
    content.innerHTML = `<div class="error"><strong>Couldn’t load spreadsheet:</strong><br>${escapeHtml(e.message || e)}</div>`;
  }
}

function openModal(id){el(id).classList.add("open")}
function closeModal(id){el(id).classList.remove("open")}
function openSettings(){
  const c=getConfig();
  el("cfgClientId").value=c.clientId;
  el("cfgFileId").value=c.fileId;
  openModal("configModal");
}
function saveSettings(){
  const client = el("cfgClientId").value.trim();
  const file = el("cfgFileId").value.trim();
  client ? localStorage.setItem("money.clientId",client) : localStorage.removeItem("money.clientId");
  file ? localStorage.setItem("money.fileId",file) : localStorage.removeItem("money.fileId");
  TOKEN_CLIENT = null;
  clearToken();
  closeModal("configModal");
  start();
}
function openAdd(){
  el("newName").value="";
  el("newDueDate").value="";
  el("newAmount").value="";
  openModal("addModal");
}
function applyTheme(theme){
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("money.theme",theme);
  el("themeBtn").textContent = theme === "dark" ? "☀" : "☾";
}

function wireStatic(){
  el("settingsBtn").onclick = openSettings;
  el("settingsBtnSignin").onclick = openSettings;
  el("settingsNav").onclick = openSettings;
  el("cfgCancel").onclick = () => closeModal("configModal");
  el("cfgSave").onclick = saveSettings;
  el("signinBtn").onclick = () => requestSignIn(false);
  el("addBtn").onclick = openAdd;
  el("addCancel").onclick = () => closeModal("addModal");
  el("addSave").onclick = addBill;
  el("refreshBtn").onclick = loadSpreadsheet;
  el("themeBtn").onclick = () => applyTheme((document.documentElement.dataset.theme||"light")==="dark" ? "light" : "dark");

  document.addEventListener("keydown",e=>{if(e.key==="Escape") document.querySelectorAll(".modal.open").forEach(m=>m.classList.remove("open"))});
  document.addEventListener("click",e=>{if(e.target.classList?.contains("modal")) e.target.classList.remove("open")});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden && getToken()) loadSpreadsheet()});

  if(localStorage.getItem("money.billsCollapsed")==="1") document.body.classList.add("bills-collapsed");
}

function start(){
  const c=getConfig();
  if(!c.clientId || !c.fileId){showSignIn();return}
  if(getToken()){showApp();loadSpreadsheet();return}
  waitForGoogle().then(()=>{
    initTokenClient();
    showSignIn();
    requestSignIn(true);
  }).catch(()=>showSignIn("Google sign-in script failed to load. Check connection or Settings."));
}

window.addEventListener("load",()=>{
  setTimeout(()=>el("splash")?.classList.add("hide"),700);
  setTimeout(()=>el("splash")?.remove(),1200);
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js?v=v3-clean-20260513-134814").catch(()=>{}));
}

wireStatic();
applyTheme(localStorage.getItem("money.theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
start();
</script>
