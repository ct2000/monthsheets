<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a7ff0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Month Spread">
<link rel="manifest" href="manifest.json?v=20260512-150017">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260512-150017">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=20260512-150017">
<title>Month Spread</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f4f6fa;
  --bg2:#eef1f6;
  --text:#1d2433;
  --muted:#7d8495;
  --panel:#ffffff;
  --panelGlass:rgba(255,255,255,.72);
  --line:#e2e6ef;
  --accent:#6a7ff0;
  --accent2:#7051d9;
  --green:#2e8b57;
  --red:#d34848;
  --shadow:0 14px 34px rgba(35,45,80,.12);
  --soft:0 7px 18px rgba(35,45,80,.08);
}
[data-theme="dark"] {
  --bg:#11151d;
  --bg2:#171c26;
  --text:#f5f7fb;
  --muted:#a1a8b5;
  --panel:#1c2230;
  --panelGlass:rgba(28,34,48,.72);
  --line:rgba(255,255,255,.10);
  --accent:#8fa0ff;
  --accent2:#a18cff;
  --green:#7bd6a3;
  --red:#ff7f7f;
  --shadow:0 18px 42px rgba(0,0,0,.35);
  --soft:0 8px 22px rgba(0,0,0,.24);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  margin:0; min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text);
}
body {
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-x:hidden;
}
body::before {
  content:"";
  position:fixed; inset:0 0 auto 0; height:250px; z-index:-2;
  background:
    radial-gradient(circle at 8% 0%, #9ca9ff 0 112px, transparent 113px),
    radial-gradient(circle at 98% 30%, #7051d9 0 150px, transparent 151px),
    linear-gradient(150deg,#6a85ee,#7051d9);
}
body::after {
  content:""; position:fixed; inset:188px 0 0 0; z-index:-1;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  border-radius:32px 32px 0 0;
}
button, select, input { font:inherit; }
button { cursor:pointer; border:0; }
.app {
  max-width:430px;
  margin:0 auto;
  padding:18px 20px 96px;
}
.topbar {
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:start;
  margin:28px 0 30px;
}
.title {
  margin:0;
  color:white;
  font-size:22px;
  font-weight:850;
  letter-spacing:-.02em;
}
.subtitle {
  margin-top:6px;
  color:rgba(255,255,255,.84);
  font-size:12px;
  line-height:1.35;
}
.toolbar {
  display:flex;
  gap:10px;
  align-items:center;
}
.month-picker, .icon-btn {
  height:34px;
  border-radius:17px;
  background:rgba(255,255,255,.96);
  color:#42506a;
  border:1px solid #e8ecf4;
  box-shadow:0 8px 22px rgba(35,45,80,.10);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.month-picker {
  width:82px;
  max-width:82px;
  min-width:82px;
  padding:0 8px;
  font-size:12px;
  font-weight:850;
  appearance:none;
  text-align:center;
  text-align-last:center;
}
.icon-btn {
  width:36px;
  display:grid;
  place-items:center;
  font-size:16px;
  padding:0;
}
.summary {
  margin-top:4px;
  padding:22px;
  background:var(--panelGlass);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:var(--shadow);
  border-radius:28px;
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}
[data-theme="dark"] .summary { border-color:var(--line); }
.kicker {
  font-size:12px;
  color:var(--muted);
  font-weight:750;
}
.big-money {
  margin:7px 0 24px;
  font-size:36px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;
}
.summary-row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.stat {
  padding:13px 14px;
  border-radius:20px;
  background:rgba(255,255,255,.55);
  border:1px solid var(--line);
}
[data-theme="dark"] .stat { background:rgba(255,255,255,.06); }
.stat-label {
  font-size:11px;
  color:var(--muted);
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.stat-value {
  margin-top:5px;
  font-size:18px;
  font-weight:900;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.quick-actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:16px 0 2px;
}
.action-btn {
  height:48px;
  border-radius:18px;
  background:var(--panel);
  color:var(--text);
  box-shadow:var(--soft);
  font-weight:850;
  border:1px solid var(--line);
}
.section-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 2px 13px;
}
.section-title {
  font-size:20px;
  font-weight:900;
  letter-spacing:-.02em;
}
.sort-picker {
  height:34px;
  width:136px;
  border-radius:17px;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  font-size:12px;
  font-weight:850;
  text-align:center;
  text-align-last:center;
  appearance:none;
  padding:0 10px;
  box-shadow:var(--soft);
}
.bill-list {
  display:flex;
  flex-direction:column;
  gap:11px;
}
.bill-card {
  display:grid;
  grid-template-columns:48px 1fr auto;
  gap:12px;
  align-items:center;
  padding:14px;
  min-height:78px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--soft);
}
.bill-icon {
  width:48px; height:48px;
  border-radius:17px;
  display:grid; place-items:center;
  background:#eef2ff;
  color:var(--accent);
  font-weight:900;
  font-size:20px;
}
[data-theme="dark"] .bill-icon { background:rgba(143,160,255,.14); }
.bill-name {
  font-size:15px;
  font-weight:900;
  line-height:1.15;
}
.bill-meta {
  margin-top:5px;
  font-size:12px;
  color:var(--muted);
}
.bill-right {
  text-align:right;
}
.bill-amount {
  font-size:15px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.status-pill {
  margin-top:7px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:64px;
  padding:4px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:900;
}
.paid-pill {
  background:#e9f8ef;
  color:var(--green);
}
.unpaid-pill {
  background:#ffecec;
  color:var(--red);
}
[data-theme="dark"] .paid-pill { background:rgba(123,214,163,.15); }
[data-theme="dark"] .unpaid-pill { background:rgba(255,127,127,.15); }
.bill-card.paid .bill-name,
.bill-card.paid .bill-amount {
  color:var(--muted);
}
.bottom-nav {
  position:fixed;
  left:50%;
  bottom:max(14px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(274px,calc(100vw - 76px));
  height:62px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  background:var(--panelGlass);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  border-radius:31px;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  z-index:20;
  overflow:hidden;
}
.nav-btn {
  background:transparent;
  color:var(--muted);
  font-size:10px;
  font-weight:850;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}
.nav-btn strong {
  width:24px; height:24px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#f5f6f8;
  font-size:17px;
  line-height:1;
}
.nav-btn.active { color:var(--accent); }
.nav-btn.active strong { background:#eef2ff; }
[data-theme="dark"] .nav-btn strong { background:rgba(255,255,255,.08); }
.empty,.spinner,.error {
  padding:44px 18px;
  text-align:center;
  color:var(--muted);
}
.error {
  border-radius:20px;
  background:rgba(211,72,72,.12);
  border:1px solid rgba(211,72,72,.25);
  color:var(--red);
}
.modal {
  position:fixed;
  inset:0;
  display:none;
  align-items:end;
  background:rgba(0,0,0,.34);
  z-index:40;
}
.modal.open { display:flex; }
.sheet {
  width:100%;
  max-width:430px;
  margin:0 auto;
  padding:22px 20px max(24px,env(safe-area-inset-bottom));
  background:var(--panel);
  border-radius:28px 28px 0 0;
  box-shadow:0 -22px 55px rgba(0,0,0,.22);
}
.sheet h2 {
  margin:0 0 16px;
  font-size:20px;
}
.field {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:12px 0;
}
.field label {
  font-size:12px;
  color:var(--muted);
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.field input {
  height:44px;
  padding:0 12px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
}
.row { display:flex; gap:10px; }
.primary,.secondary {
  height:46px;
  border-radius:16px;
  padding:0 18px;
  font-weight:850;
}
.primary { flex:1; background:var(--accent); color:white; }
.secondary { background:var(--bg); color:var(--text); }
.signin {
  max-width:430px;
  margin:86px auto;
  padding:0 20px;
}
.signin-card {
  padding:28px 22px;
  text-align:center;
  background:var(--panelGlass);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(22px);
}
.signin h1 { margin:0 0 8px; }
.signin p { color:var(--muted); line-height:1.45; }
.build-stamp {
  position:fixed;
  right:8px;
  bottom:4px;
  color:rgba(120,130,150,.38);
  font-size:9px;
  z-index:99;
  pointer-events:none;
}
</style>
</head>
<body>
<div id="app" class="app" style="display:none">
  <header class="topbar">
    <div>
      <h1 class="title">Month Spread</h1>
      <div class="subtitle" id="subtitle">Loading…</div>
    </div>
    <div class="toolbar">
      <select class="month-picker" id="monthPicker" aria-label="Choose month" style="display:none"></select>
      <button class="icon-btn" id="themeBtn" title="Light or dark mode">☾</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>
  <main id="content"><div class="spinner">Fetching your spreadsheet…</div></main>
</div>

<div id="signin" class="signin" style="display:none">
  <div class="signin-card">
    <h1>Month Spread</h1>
    <p>Sign in with Google to view and update your Month Spread spreadsheet.</p>
    <button class="primary" id="signinBtn" disabled>Loading Google sign-in…</button>
    <p><button class="secondary" id="settingsBtnSignin">Configure</button></p>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav" style="display:none">
  <button class="nav-btn active"><strong>•</strong>Home</button>
  <button class="nav-btn" id="addBtn"><strong>＋</strong>Add</button>
  <button class="nav-btn" id="reloadBtn"><strong>↻</strong>Refresh</button>
</nav>

<div class="modal" id="configModal">

    <div class="field"><label>Amount</label><input id="newAmount" inputmode="decimal" placeholder="0.00"></div>
    <div class="row"><button class="secondary" id="addCancel">Cancel</button><button class="primary" id="addSave">Add to Sheet</button></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const BUILD='20260512-150343';
const DEFAULT_CLIENT_ID = '';
const DEFAULT_FILE_ID = '1kMyQoPLnKHq6nTMpVjpM5RbyHlt495DIWmIk1wpnUXw';
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let CACHED_TABLES=[], TOKEN_CLIENT=null, CURRENT_TABLE=null, CURRENT_SORT='unpaid';

function getConfig(){return{clientId:localStorage.getItem('ms.clientId')||DEFAULT_CLIENT_ID,fileId:localStorage.getItem('ms.fileId')||DEFAULT_FILE_ID}}
function parseMoney(s){const n=parseFloat(String(s??'').replace(/[£$,\s]/g,''));return isNaN(n)?0:n}
function fmtMoney(n){return '£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(s){return String(s??'').trim().toLowerCase()}
function getToken(){try{const t=JSON.parse(localStorage.getItem('ms.token')||'null');return t&&Date.now()<t.expiry-60000?t.token:null}catch(e){return null}}
function setToken(token,expiresInSec){localStorage.setItem('ms.token',JSON.stringify({token,expiry:Date.now()+(expiresInSec||3600)*1000}))}
function clearToken(){localStorage.removeItem('ms.token')}

function initTokenClient(){
  const {clientId}=getConfig();
  if(!clientId||!window.google?.accounts?.oauth2)return null;
  TOKEN_CLIENT=google.accounts.oauth2.initTokenClient({
    client_id:clientId,
    scope:SCOPE,
    callback:r=>{
      if(r?.access_token){setToken(r.access_token,r.expires_in);showApp();loadSpreadsheet()}
      else showSignInError(r?.error_description||r?.error||'Google sign-in failed')
    }
  });
  return TOKEN_CLIENT;
}
function requestSignIn(silent=false){
  const c=TOKEN_CLIENT||initTokenClient();
  if(!c){showSignInError('Set your Google OAuth Client ID in Settings first.');return}
  c.requestAccessToken(silent?{prompt:''}:{prompt:'consent'});
}
async function api(url,opts={}){
  const token=getToken();
  if(!token)throw new Error('Not signed in');
  const res=await fetch(url,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});
  if(res.status===401){clearToken();throw new Error('Session expired — sign in again.')}
  if(!res.ok)throw new Error(`Sheets API ${res.status}: ${(await res.text()).slice(0,220)}`);
  return res.status===204?{}:res.json();
}
async function fetchSheet(){
  const {fileId}=getConfig();
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${fileId}/values/${encodeURIComponent('A1:ZZ2000')}?valueRenderOption=FORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`;
  return (await api(url)).values||[];
}
function parseTablesFromGrid(grid){
  const tables=[];
  for(let r=0;r<grid.length;r++){
    const row=grid[r]||[];
    for(let c=0;c<=row.length-3;c++){
      if(normalize(row[c])==='date due'&&normalize(row[c+1])==='due'&&normalize(row[c+2])==='paid'){
        const labelCol=c-1;if(labelCol<0)continue;
        const label=String(row[labelCol]||'').trim();if(!label||normalize(label)==='date due')continue;
        const rows=[];let blanks=0;
        for(let dr=r+1;dr<grid.length;dr++){
          const drow=grid[dr]||[];const name=String(drow[labelCol]||'').trim();
          if(!name){blanks++;if(blanks>=2)break;continue}
          blanks=0;
          rows.push({name,dueDate:String(drow[c]??'').trim(),due:parseMoney(drow[c+1]),paid:parseMoney(drow[c+2]),sheetRow:dr+1,labelCol,dateCol:c,dueCol:c+1,paidCol:c+2});
        }
        if(rows.length)tables.push({label,headerRow:r+1,labelCol,dateCol:c,dueCol:c+1,paidCol:c+2,rows});
      }
    }
  }
  return tables;
}
function colLetter(n){let s='';n++;while(n>0){let m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-m)/26)}return s}
function isRowPaid(r){return r.due<=0||r.paid===0}
function outstandingAmount(r){return r.due<=0?0:r.paid}
function effectivePaidAmount(r){return r.due<=0?0:(r.paid===0?r.due:0)}
function daysLeftInMonth(){const now=new Date();const end=new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59);return Math.max(1,Math.ceil((end-now)/86400000))}
function pickBestTable(tables){const now=new Date(), full=MONTH_NAMES[now.getMonth()].toLowerCase(), short=MONTH_SHORT[now.getMonth()].toLowerCase();const found=tables.findIndex(t=>normalize(t.label).includes(full)||normalize(t.label).includes(short));return found>=0?found:0}

function showApp(){signin.style.display='none';app.style.display='';bottomNav.style.display='grid'}
function showSignIn(){app.style.display='none';bottomNav.style.display='none';signin.style.display='';signinBtn.disabled=!getConfig().clientId;signinBtn.textContent=signinBtn.disabled?'Set Client ID in Settings':'Sign in with Google'}
function showSignInError(msg){showSignIn();document.querySelector('#signin p').textContent=msg}

function render(){
  if(!CACHED_TABLES.length){content.innerHTML='<div class="empty">No month tables found in your spreadsheet.</div>';return}
  monthPicker.innerHTML='';
  CACHED_TABLES.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(t.label||'Month').slice(0,3);monthPicker.appendChild(o)});
  let initial=localStorage.getItem('ms.selected');
  if(initial===null||!CACHED_TABLES[initial])initial=pickBestTable(CACHED_TABLES);
  monthPicker.value=initial;monthPicker.style.display='block';
  monthPicker.onchange=()=>{localStorage.setItem('ms.selected',monthPicker.value);renderMonth(CACHED_TABLES[monthPicker.value])};
  renderMonth(CACHED_TABLES[initial]);
}
function sortedRows(rows){
  const arr=[...rows];
  if(CURRENT_SORT==='paid')arr.sort((a,b)=>(isRowPaid(b)?1:0)-(isRowPaid(a)?1:0));
  else if(CURRENT_SORT==='amount')arr.sort((a,b)=>b.due-a.due);
  else if(CURRENT_SORT==='date')arr.sort((a,b)=>(parseInt(a.dueDate)||99)-(parseInt(b.dueDate)||99));
  else arr.sort((a,b)=>(isRowPaid(a)?1:0)-(isRowPaid(b)?1:0));
  return arr;
}
function renderMonth(table){
  CURRENT_TABLE=table;
  const totalPaid=table.rows.reduce((s,r)=>s+effectivePaidAmount(r),0);
  const outstanding=table.rows.reduce((s,r)=>s+outstandingAmount(r),0);
  subtitle.textContent=`${table.label} · ${table.rows.length} bills · refreshed ${new Date().toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
  const bills=sortedRows(table.rows).map(r=>{
    const paid=isRowPaid(r);
    return `<article class="bill-card ${paid?'paid':'unpaid'}">
      <div class="bill-icon">£</div>
      <div><div class="bill-name">${escapeHtml(r.name)}</div><div class="bill-meta">Due ${escapeHtml(r.dueDate||'—')}</div></div>
      <div class="bill-right"><div class="bill-amount">${fmtMoney(r.due)}</div><button class="status-pill ${paid?'paid-pill':'unpaid-pill'}" data-row="${r.sheetRow}">${paid?'Paid':'Unpaid'}</button></div>
    </article>`;
  }).join('');
  content.innerHTML=`<section class="summary">
    <div class="kicker">Outstanding</div>
    <div class="big-money">${fmtMoney(outstanding)}</div>
    <div class="summary-row">
      <div class="stat"><div class="stat-label">Still to pay</div><div class="stat-value">${fmtMoney(outstanding)}</div></div>
      <div class="stat"><div class="stat-label">Days left</div><div class="stat-value">${daysLeftInMonth()}</div></div>
    </div>
  </section>
  <div class="quick-actions"><button class="action-btn" id="addInline">＋ Add bill</button><button class="action-btn" id="refreshInline">↻ Refresh</button></div>
  <section class="section-head"><div class="section-title">Bills</div><select class="sort-picker" id="sortBills">
    <option value="unpaid">Unpaid first</option><option value="paid">Paid first</option><option value="date">Due date</option><option value="amount">Amount</option>
  </select></section>
  <section class="bill-list">${bills}</section>`;
  sortBills.value=CURRENT_SORT;
  sortBills.onchange=e=>{CURRENT_SORT=e.target.value;renderMonth(CURRENT_TABLE)};
  addInline.onclick=openAdd;
  refreshInline.onclick=loadSpreadsheet;
  document.querySelectorAll('[data-row]').forEach(btn=>btn.onclick=()=>togglePaid(btn.dataset.row));
}
async function togglePaid(sheetRow){
  const r=CURRENT_TABLE.rows.find(x=>String(x.sheetRow)===String(sheetRow));if(!r)return;
  const newOutstanding=isRowPaid(r)?r.due:0;
  await updateValues(`${colLetter(r.paidCol)}${r.sheetRow}`,[[newOutstanding]]);
  await loadSpreadsheet();
}
async function updateValues(range,values){
  const {fileId}=getConfig();
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${fileId}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
  return api(url,{method:'PUT',body:JSON.stringify({range,majorDimension:'ROWS',values})});
}
async function appendBill(){
  const name=newName.value.trim(), dueDate=newDueDate.value.trim(), amount=parseMoney(newAmount.value);
  if(!name||!CURRENT_TABLE)return;
  const row=Math.max(...CURRENT_TABLE.rows.map(r=>r.sheetRow))+1;
  await updateValues(`${colLetter(CURRENT_TABLE.labelCol)}${row}:${colLetter(CURRENT_TABLE.paidCol)}${row}`,[[name,dueDate,amount,amount]]);
  closeAdd();await loadSpreadsheet();
}
async function loadSpreadsheet(){
  content.innerHTML='<div class="spinner">Fetching your spreadsheet…</div>';
  try{CACHED_TABLES=parseTablesFromGrid(await fetchSheet());render()}
  catch(e){if(String(e.message).toLowerCase().includes('sign')){showSignIn();return}content.innerHTML=`<div class="error"><strong>Couldn’t load spreadsheet:</strong><br>${escapeHtml(e.message||e)}</div>`}
}
function openConfig(){const c=getConfig();cfgClientId.value=c.clientId;cfgFileId.value=c.fileId;configModal.classList.add('open')}
function closeConfig(){configModal.classList.remove('open')}
function openAdd(){newName.value='';newDueDate.value='';newAmount.value='';addModal.classList.add('open')}
function closeAdd(){addModal.classList.remove('open')}
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('ms.theme',t);themeBtn.textContent=t==='dark'?'☀':'☾'}
themeBtn.onclick=()=>applyTheme((document.documentElement.dataset.theme||'light')==='dark'?'light':'dark');
applyTheme(localStorage.getItem('ms.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
settingsBtn.onclick=openConfig; settingsBtnSignin.onclick=openConfig; reloadBtn.onclick=loadSpreadsheet; addBtn.onclick=openAdd;
signinBtn.onclick=()=>requestSignIn(false); cfgCancel.onclick=closeConfig; cfgSave.onclick=()=>{cfgClientId.value.trim()?localStorage.setItem('ms.clientId',cfgClientId.value.trim()):localStorage.removeItem('ms.clientId');cfgFileId.value.trim()?localStorage.setItem('ms.fileId',cfgFileId.value.trim()):localStorage.removeItem('ms.fileId');TOKEN_CLIENT=null;clearToken();closeConfig();start()};
addCancel.onclick=closeAdd; addSave.onclick=appendBill;
function waitForGoogle(timeout=10000){return new Promise((res,rej)=>{const t=Date.now();(function tick(){if(window.google?.accounts?.oauth2)return res();if(Date.now()-t>timeout)return rej(new Error('Google sign-in script failed to load'));setTimeout(tick,100)})()})}
function start(){const c=getConfig();if(!c.clientId||!c.fileId){showSignIn();return}if(getToken()){showApp();loadSpreadsheet();return}waitForGoogle().then(()=>{initTokenClient();showSignIn();requestSignIn(true)}).catch(()=>showSignIn())}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register(`service-worker.js?v=${BUILD}`).catch(()=>{}));
start();
</script>
</body>
