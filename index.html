<style>
:root {
  color-scheme: light dark;
  --bg:#f3f6fb; --bg2:#e9edf6; --text:#111827; --muted:#737b8c;
  --card:rgba(255,255,255,.78); --cardSolid:#ffffff; --stroke:rgba(255,255,255,.58); --line:#e7ebf3;
  --blue:#5d7df2; --green:#4aa37a; --red:#dc4a4a;
  --shadow:0 18px 45px rgba(35,48,84,.14); --soft:0 8px 24px rgba(35,48,84,.10);
}
[data-theme="dark"] {
  --bg:#0f1219; --bg2:#161b25; --text:#f7f8fb; --muted:#a6adba;
  --card:rgba(31,36,49,.76); --cardSolid:#1c2230; --stroke:rgba(255,255,255,.10); --line:rgba(255,255,255,.10);
  --blue:#7f9aff; --green:#75c79f; --red:#ff7777;
  --shadow:0 22px 55px rgba(0,0,0,.38); --soft:0 10px 28px rgba(0,0,0,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:310px;z-index:-2;background:radial-gradient(circle at 18% 10%,#a7b5ff 0 72px,transparent 73px),radial-gradient(circle at 92% 24%,#6e48d7 0 150px,transparent 151px),linear-gradient(145deg,#6a8df4 0%,#6278ec 52%,#6f45ca 100%)}
body:after{content:"";position:fixed;inset:238px 0 0 0;z-index:-1;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);border-radius:34px 34px 0 0}
button,select,input{font:inherit} button{cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:18px 18px 92px}
.topbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;margin:20px 0 20px}
.title{margin:0;color:white;font-size:22px;font-weight:850;letter-spacing:-.02em}
.subtitle{color:rgba(255,255,255,.84);font-size:12px;margin-top:6px;line-height:1.3}
.toolbar{display:flex;align-items:center;gap:7px}
.month-picker,.icon-btn,.sort-picker{height:36px;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.22);color:white;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:18px;box-shadow:0 8px 24px rgba(26,35,71,.12)}
.month-picker{width:76px;padding:0 10px;font-size:13px;font-weight:800;appearance:none;text-align:center;text-align-last:center}
.icon-btn{width:36px;padding:0;display:grid;place-items:center;font-size:16px}
.sort-picker{background:var(--cardSolid);color:var(--text);border-color:var(--line);height:34px;width:132px;font-size:12px;font-weight:800;padding:0 10px;appearance:none;text-align:center;text-align-last:center}
.glass-card{background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow);border-radius:30px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.summary{padding:23px 22px;margin-top:24px}
.kicker{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.02em}
.big-money{font-size:36px;font-weight:900;letter-spacing:-.04em;margin:6px 0 20px;font-variant-numeric:tabular-nums}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-mini{background:rgba(255,255,255,.44);border:1px solid var(--line);border-radius:20px;padding:13px 14px}
[data-theme="dark"] .stat-mini{background:rgba(255,255,255,.06)}
.stat-label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.stat-value{font-size:18px;font-weight:900;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--blue)}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 10px}
.action-btn{height:48px;border:0;border-radius:18px;background:rgba(255,255,255,.78);color:var(--text);box-shadow:var(--soft);font-weight:850}
[data-theme="dark"] .action-btn{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
.section-title{font-size:20px;font-weight:900;letter-spacing:-.02em}
.bill-list{display:flex;flex-direction:column;gap:11px}
.bill-card{background:var(--cardSolid);border:1px solid var(--line);box-shadow:var(--soft);border-radius:24px;padding:14px;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.bill-icon{width:48px;height:48px;border-radius:17px;background:#eef2ff;display:grid;place-items:center;font-size:20px;font-weight:900;color:var(--blue)}
[data-theme="dark"] .bill-icon{background:rgba(127,154,255,.14)}
.bill-name{font-size:15px;font-weight:900;line-height:1.15}
.bill-meta{font-size:12px;color:var(--muted);margin-top:5px}
.bill-amount{text-align:right;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.status-pill{display:inline-flex;margin-top:7px;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:900;border:0}
.paid-pill{background:rgba(74,163,122,.13);color:var(--green)} .unpaid-pill{background:rgba(220,74,74,.12);color:var(--red)}
.bill-card.paid .bill-name,.bill-card.paid .bill-amount{color:var(--muted)}
.bottom-nav{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(330px,calc(100vw - 44px));height:62px;background:var(--card);border:1px solid var(--stroke);border-radius:31px;box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;grid-template-columns:1fr 1fr 1fr;z-index:10;overflow:hidden}
.nav-btn{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px} .nav-btn strong{font-size:18px;line-height:1} .nav-btn.active{color:var(--blue)}
.empty,.spinner,.error{padding:42px 20px;text-align:center;color:var(--muted)} .error{background:rgba(220,74,74,.12);border:1px solid rgba(220,74,74,.25);border-radius:20px;color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.34);display:none;align-items:end;z-index:30} .modal.open{display:flex}
.sheet{width:100%;max-width:480px;margin:0 auto;background:var(--cardSolid);border-radius:28px 28px 0 0;padding:22px 18px max(24px,env(safe-area-inset-bottom));box-shadow:0 -22px 55px rgba(0,0,0,.22)}
.sheet h2{margin:0 0 16px;font-size:20px} .field{display:flex;flex-direction:column;gap:6px;margin:12px 0} .field label{font-size:12px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.04em} .field input{height:44px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--text);padding:0 12px}
.row{display:flex;gap:10px} .primary,.secondary{height:46px;border-radius:16px;font-weight:850;border:0;padding:0 18px} .primary{background:var(--blue);color:white;flex:1} .secondary{background:var(--bg);color:var(--text)}
.signin{max-width:420px;margin:90px auto;padding:0 20px} .signin .glass-card{padding:28px 22px;text-align:center} .signin h1{margin:0 0 8px} .signin p{color:var(--muted);line-height:1.45}
.build-stamp{position:fixed;right:10px;bottom:6px;font-size:9px;color:rgba(120,130,150,.45);z-index:99;pointer-events:none}
@media(min-width:760px){.app{max-width:720px}.bill-list{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app" class="app" style="display:none">
  <header class="topbar">
    <div><h1 class="title">Month Spread</h1><div class="subtitle" id="subtitle">Loading…</div></div>
    <div class="toolbar">
      <select class="month-picker" id="monthPicker" aria-label="Choose month" style="display:none"></select>
      <button class="icon-btn" id="themeBtn" title="Light or dark mode">☾</button>
      <button class="icon-btn" id="reloadBtn" title="Reload">↻</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>
  <main id="content"><div class="spinner">Fetching your spreadsheet…</div></main>
</div>
<div id="signin" class="signin" style="display:none"><div class="glass-card"><h1>Month Spread</h1><p>Sign in with Google to view and update your Month Spread spreadsheet.</p><button class="primary" id="signinBtn" disabled>Loading Google sign-in…</button><p><button class="secondary" id="settingsBtnSignin">Configure</button></p></div></div>
<nav class="bottom-nav" id="bottomNav" style="display:none"><button class="nav-btn active"><strong>⌂</strong>Home</button><button class="nav-btn" id="addBtn"><strong>＋</strong>Add</button><button class="nav-btn" id="settingsBtnNav"><strong>⚙</strong>More</button></nav>
<div class="modal" id="configModal"><div class="sheet"><h2>Settings</h2><div class="field"><label>Google OAuth Client ID</label><input id="cfgClientId" placeholder="123…apps.googleusercontent.com"></div><div class="field"><label>Google Sheet File ID</label><input id="cfgFileId" placeholder="Sheet file ID"></div><div class="row"><button class="secondary" id="cfgCancel">Cancel</button><button class="primary" id="cfgSave">Save</button></div></div></div>
<div class="modal" id="addModal"><div class="sheet"><h2>Add bill</h2><div class="field"><label>Name</label><input id="newName" placeholder="e.g. Car insurance"></div><div class="field"><label>Date due</label><input id="newDueDate" inputmode="numeric" placeholder="e.g. 14"></div><div class="field"><label>Amount</label><input id="newAmount" inputmode="decimal" placeholder="0.00"></div><div class="row"><button class="secondary" id="addCancel">Cancel</button><button class="primary" id="addSave">Add to Sheet</button></div></div></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const BUILD='20260512-145628';
const DEFAULT_CLIENT_ID = '';
const DEFAULT_FILE_ID = '1kMyQoPLnKHq6nTMpVjpM5RbyHlt495DIWmIk1wpnUXw';
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let CACHED_TABLES=[], TOKEN_CLIENT=null, CURRENT_TABLE=null, CURRENT_SORT='unpaid';
function getConfig(){return{clientId:localStorage.getItem('ms.clientId')||DEFAULT_CLIENT_ID,fileId:localStorage.getItem('ms.fileId')||DEFAULT_FILE_ID}}
function parseMoney(s){const n=parseFloat(String(s??'').replace(/[£$,\s]/g,''));return isNaN(n)?0:n}
function fmtMoney(n){return '£'+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(s){return String(s??'').trim().toLowerCase()}
function getToken(){try{const t=JSON.parse(localStorage.getItem('ms.token')||'null');return t&&Date.now()<t.expiry-60000?t.token:null}catch(e){return null}}
function setToken(token,expiresInSec){localStorage.setItem('ms.token',JSON.stringify({token,expiry:Date.now()+(expiresInSec||3600)*1000}))}
function clearToken(){localStorage.removeItem('ms.token')}
function initTokenClient(){const {clientId}=getConfig(); if(!clientId||!window.google?.accounts?.oauth2)return null; TOKEN_CLIENT=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:SCOPE,callback:r=>{if(r?.access_token){setToken(r.access_token,r.expires_in);showApp();loadSpreadsheet()}else showSignInError(r?.error_description||r?.error||'Google sign-in failed')}}); return TOKEN_CLIENT}
function requestSignIn(silent=false){const c=TOKEN_CLIENT||initTokenClient(); if(!c){showSignInError('Set your Google OAuth Client ID in Settings first.');return} c.requestAccessToken(silent?{prompt:''}:{prompt:'consent'})}
async function api(url,opts={}){const token=getToken(); if(!token)throw new Error('Not signed in'); const res=await fetch(url,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}}); if(res.status===401){clearToken();throw new Error('Session expired — sign in again.')} if(!res.ok)throw new Error(`Sheets API ${res.status}: ${(await res.text()).slice(0,220)}`); return res.status===204?{}:res.json()}
async function fetchSheet(){const {fileId}=getConfig(); const url=`https://sheets.googleapis.com/v4/spreadsheets/${fileId}/values/${encodeURIComponent('A1:ZZ2000')}?valueRenderOption=FORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING&build=${BUILD}`; return (await api(url)).values||[]}
function parseTablesFromGrid(grid){const tables=[]; for(let r=0;r<grid.length;r++){const row=grid[r]||[]; for(let c=0;c<=row.length-3;c++){if(normalize(row[c])==='date due'&&normalize(row[c+1])==='due'&&normalize(row[c+2])==='paid'){const labelCol=c-1; if(labelCol<0)continue; const label=String(row[labelCol]||'').trim(); if(!label||normalize(label)==='date due')continue; const rows=[]; let blanks=0; for(let dr=r+1;dr<grid.length;dr++){const drow=grid[dr]||[]; const name=String(drow[labelCol]||'').trim(); if(!name){blanks++; if(blanks>=2)break; continue} blanks=0; rows.push({name,dueDate:String(drow[c]??'').trim(),due:parseMoney(drow[c+1]),paid:parseMoney(drow[c+2]),sheetRow:dr+1,labelCol,dateCol:c,dueCol:c+1,paidCol:c+2})} if(rows.length)tables.push({label,headerRow:r+1,labelCol,dateCol:c,dueCol:c+1,paidCol:c+2,rows})}}} return tables}
function colLetter(n){let s='';n++;while(n>0){let m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-m)/26)}return s}
function isRowPaid(r){return r.due<=0||r.paid===0} function outstandingAmount(r){return r.due<=0?0:r.paid} function effectivePaidAmount(r){return r.due<=0?0:(r.paid===0?r.due:0)} function daysLeftInMonth(){const now=new Date();const end=new Date(now.getFullYear(),now.getMonth()+1,0);return Math.max(1,Math.ceil((end-now)/86400000))}
function pickBestTable(tables){const now=new Date(), full=MONTH_NAMES[now.getMonth()].toLowerCase(), short=MONTH_SHORT[now.getMonth()].toLowerCase(); const found=tables.findIndex(t=>normalize(t.label).includes(full)||normalize(t.label).includes(short)); return found>=0?found:0}
function showApp(){signin.style.display='none';app.style.display='';bottomNav.style.display='grid'} function showSignIn(){app.style.display='none';bottomNav.style.display='none';signin.style.display='';signinBtn.disabled=!getConfig().clientId;signinBtn.textContent=signinBtn.disabled?'Set Client ID in Settings':'Sign in with Google'} function showSignInError(msg){showSignIn();document.querySelector('#signin p').textContent=msg}
function render(){const picker=monthPicker, content=document.getElementById('content'); if(!CACHED_TABLES.length){content.innerHTML='<div class="empty">No month tables found in your spreadsheet.</div>';return} picker.innerHTML=''; CACHED_TABLES.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(t.label||'Month').slice(0,3);picker.appendChild(o)}); let initial=localStorage.getItem('ms.selected'); if(initial===null||!CACHED_TABLES[initial])initial=pickBestTable(CACHED_TABLES); picker.value=initial; picker.style.display='block'; picker.onchange=()=>{localStorage.setItem('ms.selected',picker.value);renderMonth(CACHED_TABLES[picker.value])}; renderMonth(CACHED_TABLES[initial])}
function sortedRows(rows){const arr=[...rows]; if(CURRENT_SORT==='paid') arr.sort((a,b)=>(isRowPaid(b)?1:0)-(isRowPaid(a)?1:0)); else if(CURRENT_SORT==='amount') arr.sort((a,b)=>b.due-a.due); else if(CURRENT_SORT==='date') arr.sort((a,b)=>(parseInt(a.dueDate)||99)-(parseInt(b.dueDate)||99)); else arr.sort((a,b)=>(isRowPaid(a)?1:0)-(isRowPaid(b)?1:0)); return arr}
function renderMonth(table){CURRENT_TABLE=table; const totalPaid=table.rows.reduce((s,r)=>s+effectivePaidAmount(r),0), outstanding=table.rows.reduce((s,r)=>s+outstandingAmount(r),0); subtitle.textContent=`${table.label} · ${table.rows.length} bills · refreshed ${new Date().toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit'})}`; const bills=sortedRows(table.rows).map(r=>{const paid=isRowPaid(r); return `<article class="bill-card ${paid?'paid':'unpaid'}"><div class="bill-icon">£</div><div><div class="bill-name">${escapeHtml(r.name)}</div><div class="bill-meta">Due ${escapeHtml(r.dueDate||'—')}</div></div><div><div class="bill-amount">${fmtMoney(r.due)}</div><button class="status-pill ${paid?'paid-pill':'unpaid-pill'}" data-row="${r.sheetRow}">${paid?'Paid':'Unpaid'}</button></div></article>`}).join(''); content.innerHTML=`<section class="summary glass-card"><div class="kicker">Outstanding</div><div class="big-money">${fmtMoney(outstanding)}</div><div class="stats-row"><div class="stat-mini"><div class="stat-label">Paid so far</div><div class="stat-value">${fmtMoney(totalPaid)}</div></div><div class="stat-mini"><div class="stat-label">Days left</div><div class="stat-value">${daysLeftInMonth()}</div></div></div></section><div class="actions-grid"><button class="action-btn" id="addInline">＋ Add bill</button><button class="action-btn" id="refreshInline">↻ Refresh</button></div><section class="section-head"><div class="section-title">Bills</div><select class="sort-picker" id="sortBills"><option value="unpaid">Unpaid first</option><option value="paid">Paid first</option><option value="date">Due date</option><option value="amount">Amount</option></select></section><section class="bill-list">${bills}</section>`; sortBills.value=CURRENT_SORT; sortBills.onchange=e=>{CURRENT_SORT=e.target.value;renderMonth(CURRENT_TABLE)}; addInline.onclick=openAdd; refreshInline.onclick=loadSpreadsheet; document.querySelectorAll('[data-row]').forEach(btn=>btn.onclick=()=>togglePaid(btn.dataset.row))}
async function togglePaid(sheetRow){const r=CURRENT_TABLE.rows.find(x=>String(x.sheetRow)===String(sheetRow)); if(!r)return; const newOutstanding=isRowPaid(r)?r.due:0; await updateValues(`${colLetter(r.paidCol)}${r.sheetRow}`, [[newOutstanding]]); await loadSpreadsheet()}
async function updateValues(range, values){const {fileId}=getConfig(); const url=`https://sheets.googleapis.com/v4/spreadsheets/${fileId}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`; return api(url,{method:'PUT',body:JSON.stringify({range,majorDimension:'ROWS',values})})}
async function appendBill(){const name=newName.value.trim(), dueDate=newDueDate.value.trim(), amount=parseMoney(newAmount.value); if(!name||!CURRENT_TABLE)return; const row=Math.max(...CURRENT_TABLE.rows.map(r=>r.sheetRow))+1; await updateValues(`${colLetter(CURRENT_TABLE.labelCol)}${row}:${colLetter(CURRENT_TABLE.paidCol)}${row}`, [[name,dueDate,amount,amount]]); closeAdd(); await loadSpreadsheet()}
async function loadSpreadsheet(){content.innerHTML='<div class="spinner">Fetching your spreadsheet…</div>'; try{CACHED_TABLES=parseTablesFromGrid(await fetchSheet());render()}catch(e){if(String(e.message).toLowerCase().includes('sign')){showSignIn();return}content.innerHTML=`<div class="error"><strong>Couldn’t load spreadsheet:</strong><br>${escapeHtml(e.message||e)}</div>`}}
function openConfig(){const c=getConfig();cfgClientId.value=c.clientId;cfgFileId.value=c.fileId;configModal.classList.add('open')} function closeConfig(){configModal.classList.remove('open')} function openAdd(){newName.value='';newDueDate.value='';newAmount.value='';addModal.classList.add('open')} function closeAdd(){addModal.classList.remove('open')}
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('ms.theme',t);themeBtn.textContent=t==='dark'?'☀':'☾'}
themeBtn.onclick=()=>applyTheme((document.documentElement.dataset.theme||'light')==='dark'?'light':'dark'); applyTheme(localStorage.getItem('ms.theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
reloadBtn.onclick=loadSpreadsheet; settingsBtn.onclick=openConfig; settingsBtnSignin.onclick=openConfig; settingsBtnNav.onclick=openConfig; addBtn.onclick=openAdd; signinBtn.onclick=()=>requestSignIn(false); cfgCancel.onclick=closeConfig; addCancel.onclick=closeAdd; addSave.onclick=appendBill;
cfgSave.onclick=()=>{cfgClientId.value.trim()?localStorage.setItem('ms.clientId',cfgClientId.value.trim()):localStorage.removeItem('ms.clientId');cfgFileId.value.trim()?localStorage.setItem('ms.fileId',cfgFileId.value.trim()):localStorage.removeItem('ms.fileId');TOKEN_CLIENT=null;clearToken();closeConfig();start()};
function waitForGoogle(timeout=10000){return new Promise((res,rej)=>{const t=Date.now();(function tick(){if(window.google?.accounts?.oauth2)return res();if(Date.now()-t>timeout)return rej(new Error('Google sign-in script failed to load'));setTimeout(tick,100)})()})} function start(){const c=getConfig();if(!c.clientId||!c.fileId){showSignIn();return}if(getToken()){showApp();loadSpreadsheet();return}waitForGoogle().then(()=>{initTokenClient();showSignIn();requestSignIn(true)}).catch(()=>showSignIn())}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register(`service-worker.js?v=${BUILD}`).catch(()=>{}));
start();
</script>
